<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ClubHub Reports &amp; Analytics{% endblock %}</title>
    <!-- Chart.js for data visualization -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/reports/reports.css">
</head>
<body>
    <header class="reports-header">
        <div class="header-container">
            <div class="brand-group">
                <a href="{% url 'reports:dashboard' %}" class="brand-link">
                    <span class="brand-icon">📊</span>
                    <span class="brand-name">ClubHub Reports</span>
                </a>
                <span class="brand-badge">Admin Analytics Module</span>
            </div>
            <nav class="header-nav">
                <a href="{% url 'reports:dashboard' %}" class="nav-item active">Dashboard</a>
                <a href="{% url 'reports:export_csv' %}" class="nav-item btn-export">📥 Export CSV</a>
                <a href="http://localhost/clubhub/pages/dashboard.php" class="nav-item btn-return">&larr; Return to ClubHub PHP Portal</a>
            </nav>
        </div>
    </header>

    <main class="reports-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="reports-footer">
        <p>ClubHub Administration &bull; Django Reports Module (Phase 10) &bull; Read-Only Database Connection</p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
